<script>
(async function(){
  const container=document.getElementById('posts');
  if(!container)return;

  try{
    const response=await fetch(
      './posts.json?v='+Date.now(),
      {cache:'no-store'}
    );
    if(!response.ok)throw new Error('파일 읽기 실패');

    const posts=await response.json();
    if(!Array.isArray(posts)||!posts.length){
      throw new Error('게시글 없음');
    }

    container.replaceChildren();
    container.className='post-grid';

    posts.slice(0,10).forEach(post=>{
      if(!post.title||!post.link)return;

      const url=new URL(post.link);
      if(!['https:','http:'].includes(url.protocol))return;

      const card=document.createElement('a');
      card.className='post-card';
      card.href=url.href;
      card.target='_blank';
      card.rel='noopener noreferrer';

      if(post.image){
        const img=document.createElement('img');
        img.className='post-image';
        img.src=post.image;
        img.alt=post.title;
        img.loading='lazy';
        img.onerror=()=>{
          const placeholder=document.createElement('div');
          placeholder.className='post-placeholder';
          placeholder.textContent='시공사진 준비 중';
          img.replaceWith(placeholder);
        };
        card.appendChild(img);
      }else{
        const placeholder=document.createElement('div');
        placeholder.className='post-placeholder';
        placeholder.textContent='시공사진 준비 중';
        card.appendChild(placeholder);
      }

      const info=document.createElement('div');
      info.className='post-info';

      const title=document.createElement('p');
      title.className='post-title';
      title.textContent=post.title;

      const more=document.createElement('span');
      more.className='post-more';
      more.textContent='시공 사례 자세히 보기 →';

      info.append(title,more);
      card.appendChild(info);
      container.appendChild(card);
    });

    if(!container.children.length){
      throw new Error('표시할 게시글 없음');
    }
  }catch(error){
    console.error(error);
    container.className='';
    container.textContent=
      '시공 사례는 아래 네이버 블로그에서 확인해 주세요.';
  }
})();
</script>
